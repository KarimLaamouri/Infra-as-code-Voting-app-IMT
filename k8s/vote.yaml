apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: europe-west3-docker.pkg.dev/voting-app-514716/voting-image/vote:public
        name: vote
        ports:
        - containerPort: 5000
          name: vote-port
          protocol: TCP
        resources: 
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi

---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: vote
  name: vote
spec:
  ports:
  - name: vote
    port: 5000
    protocol: TCP
    targetPort: vote-port
  selector:
    app: vote
  type: LoadBalancer
